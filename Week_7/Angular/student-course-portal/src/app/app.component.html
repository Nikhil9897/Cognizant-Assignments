<app-loading-spinner></app-loading-spinner>

<!-- First-Time User Onboarding Wizard -->
<app-onboarding *ngIf="showOnboarding" (finishOnboarding)="onFinishOnboarding()"></app-onboarding>

<div class="app-layout" *ngIf="!showOnboarding">
  <app-header (openOnboarding)="startOnboarding()"></app-header>

  <div class="app-body">
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-footer></app-footer>
</div>
